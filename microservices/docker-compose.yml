  version: '3.8'

  services:
    # ============================================
    # DATABASE MYSQL (Shared)
    # ============================================
    mysql:
      image: mysql:8.0
      container_name: perpus-mysql
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: auth_service_db
      ports:
        - "3307:3306"
      volumes:
        - mysql_data:/var/lib/mysql
      networks:
        - perpus-network
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
        interval: 10s
        timeout: 5s
        retries: 5

    # ============================================
    # REDIS (Shared)
    # ============================================
    redis:
      image: redis:7-alpine
      container_name: perpus-redis
      restart: unless-stopped
      ports:
        - "6380:6379"
      networks:
        - perpus-network
      healthcheck:
        test: ["CMD", "redis-cli", "-h", "localhost", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

    # ============================================
    # AUTH SERVICE
    # ============================================
    auth-service:
      build:
        context: ./auth-service
        dockerfile: Dockerfile
      container_name: auth-service
      restart: unless-stopped
      ports:
        - "8001:80"
      environment:
        APP_ENV: local
        APP_DEBUG: "true"
        APP_URL: http://localhost:8001
        
        # Database
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: auth_service_db
        DB_USERNAME: root
        DB_PASSWORD: root
        
        # Redis
        REDIS_HOST: redis
        REDIS_PORT: 6379
        REDIS_PASSWORD: null
        
        # Email (Brevo SMTP)
        MAIL_MAILER: smtp
        MAIL_HOST: smtp-relay.brevo.com
        MAIL_PORT: 587
        MAIL_USERNAME: a8be27001@smtp-brevo.com
        MAIL_PASSWORD: ######  # GANTI dengan password asli
        MAIL_ENCRYPTION: tls
        MAIL_FROM_ADDRESS: christoferkevin560@gmail.com
        MAIL_FROM_NAME: "Perpustakaan HKBP"
      volumes:
        - ./auth-service:/var/www/html
        # Exclude vendor dari mount (gunakan vendor di container)
        - /var/www/html/vendor
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - perpus-network

  networks:
    perpus-network:
      driver: bridge

  volumes:
    mysql_data:
      driver: local